<!doctype html>
<html lang="es">
  <head>

    <!--
      Página 404: GitHub Pages la muestra cuando alguien abre una dirección que no existe.
      Usa rutas que empiezan con / porque puede aparecer en cualquier dirección del sitio.
    -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0b1426">
    <title>Página no encontrada | Junior Lazo</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;700&display=swap">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/componentes.css">
    <link rel="stylesheet" href="/css/mascotas.css">
  </head>
  <body>
    <main class="pagina-simple">
      <div>
        <div class="pagina-simple__mascota mascota--ambar" data-mascota aria-hidden="true"></div>
        <h1>Error 404: señal perdida.</h1>
        <p>Esta página no existe. Puede que el enlace esté incompleto o que haya cambiado de lugar.</p>
        <a class="boton boton--principal" href="/">Volver al portafolio</a>
      </div>
    </main>
    <script src="/js/mascotas.js"></script>
    <script>
      // Solo se dibuja el robot; sin JavaScript la página se ve igual, sin él.
      document.querySelectorAll('[data-mascota]').forEach((el) => { el.innerHTML = window.Portafolio.dibujarBot(); });
    </script>
  </body>
</html>
