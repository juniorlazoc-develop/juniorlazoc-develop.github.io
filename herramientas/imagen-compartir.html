<!doctype html>
<html lang="es">
  <head>

    <!--
      Fuente de assets/compartir.png: la imagen que muestran LinkedIn,
      WhatsApp y otras redes al compartir el enlace (1200 × 630 px).
      Para regenerarla, sigue las instrucciones de herramientas/LEEME.md.
    -->
    <meta charset="utf-8">
    <title>Imagen para compartir</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap">
    <link rel="stylesheet" href="../css/base.css">
    <style>
      html, body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .tarjeta {
        position: relative;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 74px 96px;
        background:
          linear-gradient(#ffffff08 1px, transparent 1px) 0 0 / 60px 60px,
          linear-gradient(90deg, #ffffff08 1px, transparent 1px) 0 0 / 60px 60px,
          var(--tinta);
        color: var(--texto-claro);
        overflow: hidden;
      }
      .logo {
        position: absolute;
        top: 84px;
        right: 96px;
        width: 120px;
        height: 120px;
      }
      .etiqueta {
        color: var(--salvia);
        font-size: 22px;
        margin-bottom: 28px;
      }
      .etiqueta::before {
        width: 44px;
      }
      h1 {
        margin: 0 0 26px;
        font-size: 92px;
        line-height: 1;
        color: #f4efe4;
      }
      h1 span {
        display: block;
        color: var(--texto-claro-suave);
        font-weight: 500;
      }
      .descripcion {
        margin: 0;
        max-width: 760px;
        font-size: 30px;
        line-height: 1.4;
        color: var(--texto-claro-suave);
      }
      .descripcion b {
        color: var(--texto-claro);
        font-weight: 500;
      }
      .enlace {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 70px;
        height: 3px;
        background: #2c6650;
      }
      .enlace::before, .enlace::after {
        content: "";
        position: absolute;
        top: -9px;
        width: 21px;
        height: 21px;
        border-radius: 50%;
      }
      .enlace::before { left: -4px; background: #4f9a76; }
      .enlace::after { right: -4px; background: var(--laton); }
      .web {
        position: absolute;
        right: 96px;
        bottom: 96px;
        font-family: var(--fuente-mono);
        font-size: 20px;
        color: var(--salvia);
      }
    </style>
  </head>
  <body>
    <div class="tarjeta">
      <img class="logo" src="../assets/favicon.svg?v=3" alt="">
      <p class="etiqueta">Analista de Redes · NOC · Automatización</p>
      <h1>Junior Lazo <span>Chileno</span></h1>
      <p class="descripcion">Redes de fibra óptica <b>GPON/FTTH</b> y herramientas en <b>Python</b> para detectar fallas a tiempo.</p>
      <p class="web">juniorlazoc-develop.github.io</p>
      <div class="enlace"></div>
    </div>
  </body>
</html>
