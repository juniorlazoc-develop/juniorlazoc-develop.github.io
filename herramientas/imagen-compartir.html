<!doctype html>
<html lang="es">
  <head>

    <!--
      Fuente de assets/compartir.png: la imagen que muestran LinkedIn,
      WhatsApp y otras redes al compartir el enlace (1200 × 630 px).
      Para regenerarla, sigue las instrucciones de herramientas/LEEME.md.
    -->
    <meta charset="utf-8">
    <title>Imagen para compartir</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Inter:wght@400;600&display=swap">
    <style>
      html, body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .tarjeta {
        position: relative;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 90px 96px;
        background: #faf6ef;
        color: #2b2620;
        font-family: 'Inter', 'Segoe UI', sans-serif;
        overflow: hidden;
      }
      .circulo {
        position: absolute;
        border-radius: 50%;
      }
      .circulo--salvia {
        width: 420px;
        height: 420px;
        right: -90px;
        top: -110px;
        background: #e4ece0;
      }
      .circulo--terracota {
        width: 260px;
        height: 260px;
        right: 160px;
        bottom: -120px;
        background: #f7e3d8;
      }
      .saludo {
        position: relative;
        margin: 0 0 6px;
        font: italic 400 40px/1.2 'Fraunces', Georgia, serif;
        color: #4f6b52;
      }
      h1 {
        position: relative;
        margin: 0 0 28px;
        font: 600 112px/1 'Fraunces', Georgia, serif;
        letter-spacing: -2px;
      }
      .descripcion {
        position: relative;
        margin: 0;
        max-width: 760px;
        font-size: 32px;
        line-height: 1.4;
        color: #625a51;
      }
      .pie {
        position: absolute;
        left: 96px;
        bottom: 70px;
        display: flex;
        gap: 14px;
      }
      .pie span {
        padding: 10px 22px;
        border-radius: 999px;
        background: #2b2620;
        color: #faf6ef;
        font-size: 22px;
        font-weight: 600;
      }
      .pie span:first-child {
        background: #b4532f;
      }
    </style>
  </head>
  <body>
    <div class="tarjeta">
      <div class="circulo circulo--salvia"></div>
      <div class="circulo circulo--terracota"></div>
      <p class="saludo">Hola, soy</p>
      <h1>Junior Lazo.</h1>
      <p class="descripcion">Cuido redes de fibra óptica y construyo sistemas web que resuelven problemas reales.</p>
      <div class="pie">
        <span>Redes</span>
        <span>Desarrollo web</span>
        <span>Huancayo, Perú</span>
      </div>
    </div>
  </body>
</html>
