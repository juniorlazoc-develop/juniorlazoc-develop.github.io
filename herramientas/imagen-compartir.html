<!doctype html>
<html lang="es">
  <head>

    <!--
      Fuente de assets/compartir.png: la imagen que muestran LinkedIn,
      WhatsApp y otras redes al compartir el enlace (1200 × 630 px).
      Para regenerarla, sigue las instrucciones de herramientas/LEEME.md.
    -->
    <meta charset="utf-8">
    <title>Imagen para compartir</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;700&display=swap">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/mascotas.css">
    <style>
      html, body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .tarjeta {
        position: relative;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 86px 96px;
        background:
          radial-gradient(circle at 88% 18%, #1d3d73 0, transparent 42%),
          radial-gradient(circle at 8% 95%, #0f3a4a 0, transparent 38%),
          var(--marino);
        overflow: hidden;
      }
      .saludo {
        display: inline-block;
        margin: 0 0 18px;
        padding: 6px 20px;
        border-radius: 8px;
        background: var(--turquesa);
        color: var(--marino);
        font: 500 30px/1.3 var(--fuente-titulos);
      }
      h1 {
        margin: 0 0 24px;
        font-size: 110px;
        line-height: 1;
        color: var(--texto);
      }
      h1 span {
        color: var(--celeste);
      }
      .descripcion {
        margin: 0;
        max-width: 720px;
        font-size: 31px;
        line-height: 1.4;
        color: var(--texto-secundario);
      }
      .robots {
        position: absolute;
        right: 80px;
        bottom: 60px;
        display: flex;
        gap: 18px;
        align-items: flex-end;
      }
      .robots div {
        width: 110px;
        height: 110px;
      }
      .robots div:nth-child(2) {
        width: 150px;
        height: 150px;
      }
      .suelo {
        position: absolute;
        left: 96px;
        right: 80px;
        bottom: 56px;
        border-bottom: 4px dashed #8ecdf240;
      }
    </style>
  </head>
  <body>
    <div class="tarjeta">
      <p class="saludo">👋 Hola, soy</p>
      <h1>Junior <span>Lazo.</span></h1>
      <p class="descripcion">Cuido redes de fibra óptica y construyo sistemas web que resuelven problemas reales.</p>
      <div class="suelo"></div>
      <div class="robots">
        <div class="mascota--celeste" data-mascota></div>
      </div>
    </div>
    <script src="../js/mascotas.js"></script>
    <script>
      // Dibuja a Bitbot con la misma función del sitio.
      document.querySelectorAll('[data-mascota]').forEach((el) => { el.innerHTML = window.Portafolio.dibujarBot(); });
    </script>
  </body>
</html>
